<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FestFlow Admin | Command Center</title>
  <meta name="description" content="FestFlow Administrative Command Center — Manage event approvals, monitor pipeline metrics, and control your festival ecosystem.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-particles" id="login-particles"></div>
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
            <path d="M24 12L34 18V30L24 36L14 30V18L24 12Z" fill="url(#logoGrad)" opacity="0.3"/>
            <path d="M24 18L28 20.5V25.5L24 28L20 25.5V20.5L24 18Z" fill="url(#logoGrad)"/>
            <defs><linearGradient id="logoGrad" x1="6" y1="4" x2="42" y2="44"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
        </div>
        <h1>FestFlow</h1>
        <p class="login-subtitle">Administrative Command Center</p>
      </div>
      <button id="google-login-btn" class="login-btn">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
      <p id="login-error" class="login-error"></p>
    </div>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="app" class="app" style="display:none;">

    <!-- Animated Background -->
    <div class="bg-mesh"></div>
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- TOPBAR -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <div class="brand">
          <div class="brand-icon">FF</div>
          <div class="brand-text">
            <span class="brand-name">FestFlow</span>
            <span class="brand-label">Admin Panel</span>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-badge" id="admin-badge">
          <div class="admin-avatar" id="user-avatar">A</div>
          <span class="admin-name" id="admin-name">Admin</span>
        </div>
      </div>
    </header>

    <!-- METRICS ROW -->
    <section class="metrics-row" id="metrics-row">
      <div class="metric-card metric-total" id="metric-total">
        <div class="metric-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <div class="metric-data">
          <span class="metric-number" id="count-total">0</span>
          <span class="metric-label">Total Events</span>
        </div>
      </div>
      <div class="metric-card metric-pending" id="metric-pending">
        <div class="metric-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="metric-data">
          <span class="metric-number" id="count-pending">0</span>
          <span class="metric-label">Pending Approval</span>
        </div>
      </div>
      <div class="metric-card metric-approved" id="metric-approved">
        <div class="metric-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="metric-data">
          <span class="metric-number" id="count-approved">0</span>
          <span class="metric-label">Approved</span>
        </div>
      </div>
    </section>

    <!-- CONTROLS BAR -->
    <section class="controls-bar" id="controls-bar">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search events by name or code..." autocomplete="off">
      </div>
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="pending">Pending</button>
        <button class="filter-pill" data-filter="approved">Approved</button>
      </div>
      <div class="view-controls">
        <button id="toggle-layout" class="icon-btn" title="Toggle Layout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button id="refresh-data" class="icon-btn" title="Refresh Data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </section>

    <!-- EVENTS GRID -->
    <section class="events-section">
      <div id="events-container" class="events-grid">
        <!-- Injected dynamically -->
      </div>
      <div id="empty-state" class="empty-state" style="display:none;">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>No events match your criteria</p>
      </div>
    </section>

  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
